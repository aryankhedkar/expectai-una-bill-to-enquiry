<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bill to Enquiry{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site">
    <a class="brand" href="/">Bill to Enquiry</a>
    <nav>
      <a href="/">Bills</a>
      <a href="/design">Design</a>
      <a href="/outbox">Outbox</a>
    </nav>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer class="site">
    Synthetic data throughout. An independent sketch, not connected to any company's product.
    The demo treats {{ today.strftime('%d %B %Y').lstrip('0') }} as today.
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
